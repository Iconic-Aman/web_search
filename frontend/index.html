<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #0f0f0f; color: #e0e0e0; display: flex; flex-direction: column; height: 100vh; }
    #messages { flex: 1; overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
    .msg { max-width: 75%; padding: .75rem 1rem; border-radius: 12px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
    .user { align-self: flex-end; background: #2563eb; color: #fff; }
    .assistant { align-self: flex-start; background: #1e1e1e; border: 1px solid #2a2a2a; }
    .sources { margin-top: .5rem; display: flex; flex-wrap: wrap; gap: .4rem; }
    .source-chip { font-size: .75rem; background: #2a2a2a; border: 1px solid #3a3a3a; border-radius: 6px; padding: .2rem .5rem; color: #60a5fa; text-decoration: none; }
    #form { display: flex; gap: .5rem; padding: 1rem 1.5rem; border-top: 1px solid #1e1e1e; background: #0f0f0f; }
    #input { flex: 1; background: #1e1e1e; border: 1px solid #2a2a2a; border-radius: 8px; padding: .6rem 1rem; color: #e0e0e0; font-size: 1rem; outline: none; }
    #input:focus { border-color: #2563eb; }
    button { background: #2563eb; color: #fff; border: none; border-radius: 8px; padding: .6rem 1.2rem; cursor: pointer; font-size: 1rem; }
    button:disabled { opacity: .5; cursor: not-allowed; }
  </style>
</head>
<body>
  <div id="messages"></div>
  <form id="form">
    <input id="input" placeholder="Ask anything…" autocomplete="off" />
    <button id="btn" type="submit">Send</button>
  </form>

  <script>
    const SESSION_ID = crypto.randomUUID();
    const TZ = Intl.DateTimeFormat().resolvedOptions().timeZone;
    const msgs = document.getElementById("messages");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const btn = document.getElementById("btn");

    function addMsg(role, text = "", sources = []) {
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.textContent = text;
      if (sources.length) {
        const chips = document.createElement("div");
        chips.className = "sources";
        sources.forEach(s => {
          const a = document.createElement("a");
          a.className = "source-chip"; a.href = s.url; a.target = "_blank";
          a.textContent = s.title || s.url;
          chips.appendChild(a);
        });
        div.appendChild(chips);
      }
      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
      return div;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      btn.disabled = true;
      addMsg("user", text);
      const bot = addMsg("assistant", "…");
      let full = ""; const sources = [];

      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: SESSION_ID, message: text, timezone: TZ })
      });

      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = "";
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const lines = buf.split("\n\n");
        buf = lines.pop();
        for (const line of lines) {
          if (!line.startsWith("data: ")) continue;
          const ev = JSON.parse(line.slice(6));
          if (ev.type === "token") { full += ev.content; bot.textContent = full; }
          if (ev.type === "source") sources.push(ev);
          if (ev.type === "done" && sources.length) {
            const chips = document.createElement("div"); chips.className = "sources";
            sources.forEach(s => {
              const a = document.createElement("a"); a.className = "source-chip";
              a.href = s.url; a.target = "_blank"; a.textContent = s.title || s.url;
              chips.appendChild(a);
            });
            bot.appendChild(chips);
          }
        }
        msgs.scrollTop = msgs.scrollHeight;
      }
      btn.disabled = false; input.focus();
    });
  </script>
</body>
</html>
